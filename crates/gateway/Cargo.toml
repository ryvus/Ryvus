[package]
name = "ryvus-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
utoipa = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

tower-http = { workspace = true }
ryvus-protocol = { workspace = true }
ryvus-execution = { workspace = true }
ryvus-control = { workspace = true }
ryvus-docs = { workspace = true }
ryvus-action-catalog = { workspace = true }
ryvus-scheduler = { workspace = true }
ryvus-persistence = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
jsonschema = { version = "0.46.7", default-features = false }

[dev-dependencies]
ryvus-flow = { workspace = true }
tower = { version = "0.5", features = ["util"] }
