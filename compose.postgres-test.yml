services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ryvus_test
      POSTGRES_PASSWORD: ryvus_test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryvus_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ryvus-postgres-test-data:/var/lib/postgresql/data

volumes:
  ryvus-postgres-test-data:
