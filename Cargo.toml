[workspace]
resolver = "2"

members = [
  "crates/protocol",
  "crates/execution",
  "crates/persistence",
  "crates/control",
  "crates/docs",
  "crates/gateway",
  "crates/action-catalog",
  "crates/scheduler",
  "crates/flow",
  "crates/cli",
  "crates/runtime-host",
]

exclude = []

# Shared workspace settings
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ryvus Team <support@ryvus.dev>"]
repository = "https://github.com/ryvus/ryvus"

[workspace.dependencies]
ryvus-protocol = { path = "crates/protocol" }
ryvus-execution = { path = "crates/execution" }
ryvus-persistence = { path = "crates/persistence" }
ryvus-control = { path = "crates/control" }
ryvus-docs = { path = "crates/docs" }
ryvus-gateway = { path = "crates/gateway" }
ryvus-action-catalog = { path = "crates/action-catalog" }
ryvus-scheduler = { path = "crates/scheduler" }
ryvus-flow = { path = "crates/flow" }
ryvus-runtime-host = { path = "crates/runtime-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonpath-rust = "1.0.4"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }
# Useful shared testing tools
rstest = "0.18"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"

utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive"] }
url = "2"
mockall = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
dotenvy = "0.15"
