[workspace]
resolver = "2"

members = [
  # "crates/core",
  # "crates/old_engine",
  # "crates/old_flow",
  # "crates/utils",
  # "crates/ryvus",
  "crates/executor",
  "crates/protocol",
  "crates/execution",
  "crates/persistence",
  "crates/execution-service",
  "crates/control",
  "crates/docs",
  "crates/gateway",
  "crates/action-catalog",
  "crates/scheduler",
  "crates/cli",

  # sdk
  # Examples
  "examples/actions/rust-echo",

]

exclude = []

# Shared workspace settings
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ryvus Team <support@ryvus.dev>"]
repository = "https://github.com/ryvus/ryvus"

[workspace.dependencies]
# ryvus-engine = { path = "crates/old_engine" }
# ryvus-core = { path = "crates/core" }
# ryvus-flow = { path = "crates/old_flow" }
# ryvus-utils = { path = "crates/utils" }
ryvus-executor = { path = "crates/executor" }
ryvus-protocol = { path = "crates/protocol" }
ryvus-execution = { path = "crates/execution" }
ryvus-persistence = { path = "crates/persistence" }
ryvus-execution-service = { path = "crates/execution-service" }
ryvus-control = { path = "crates/control" }
ryvus-docs = { path = "crates/docs" }
ryvus-gateway = { path = "crates/gateway" }
ryvus-action-catalog = { path = "crates/action-catalog" }
ryvus-scheduler = { path = "crates/scheduler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Useful shared testing tools
rstest = "0.18"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
axum = "0.8"

utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive"] }
url = "2"
